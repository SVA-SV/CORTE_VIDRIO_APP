<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<link rel="manifest" href="manifest.webmanifest">
<title>Corte de Vidrio - Vidriería Alex</title>
<style>
:root{
  --ink:#122033;--muted:#667085;--line:#d0d5dd;--bg:#f2f6fa;--card:#fff;
  --accent:#0f4c81;--accent2:#e8f2fb;--danger:#b42318;--waste:#eef1f4;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header h1{margin:0;font-size:20px}
header small{opacity:.9}
main{max-width:1180px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid #e5e9ef;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(16,24,40,.05)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:700;color:#344054;margin-bottom:5px}
input,select,button{font:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white}
button{border:none;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;touch-action:manipulation}
.primary{background:var(--accent);color:white}
.secondary{background:var(--accent2);color:var(--accent)}
.danger{background:#fff0f0;color:var(--danger)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.table-wrap{overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:7px;border-bottom:1px solid #edf0f3;text-align:left}
th{font-size:12px;background:#f8fafc;color:#475467}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#f8fafc;border:1px solid #e5e9ef;border-radius:10px;padding:10px 12px;min-width:150px}
.kpi b{font-size:20px;display:block}
.sheet{background:#fff;border:1px solid #ccd5df;border-radius:12px;padding:12px;margin:14px 0;page-break-after:always}
.sheet-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-title{font-size:17px;font-weight:800}
.sheet-meta{font-size:12px;color:#475467;text-align:right}
.canvas-wrap{overflow:auto;background:#fafbfc;border:1px solid #e5e9ef;border-radius:8px;padding:8px}
svg{display:block;margin:auto;background:white}
.cut{stroke:#111827;stroke-width:1.2}
.cutText{font-size:11px;font-weight:800;fill:#111827}
.dimText{font-size:10px;fill:#344054}
.note{font-size:12px;color:#475467;margin-top:8px}
.status{margin-top:10px;font-size:12px;font-weight:700}
.ok{color:#027a48}.err{color:#b42318}
.install{display:none}
@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}
  .toolbar button{flex:1 1 45%;min-height:46px}
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
  .toolbar button{flex:1 1 100%}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  header,.no-print{display:none!important}
  body{background:white}
  main{padding:0;max-width:none}
  .card.results{border:0;box-shadow:none;padding:0;margin:0}
  .summary{display:none}
  .sheet{border:0;margin:0;padding:0;break-after:page}
  .canvas-wrap{border:0;padding:0;overflow:visible;background:white}
  svg{max-width:100%;height:auto}
}
</style>
</head>
<body>
<header>
  <h1>Corte de Vidrio · Vidriería Alex</h1>
  <small>Optimización por lámina · cm / pulgadas · PDF</small>
</header>

<main>
<section class="card no-print">
  <div class="grid">
    <div>
      <label>Unidad</label>
      <select id="unit">
        <option value="cm">Centímetros (cm)</option>
        <option value="in">Pulgadas (in)</option>
      </select>
    </div>
    <div><label>Ancho de lámina</label><input id="sheetW" type="number" step="0.01" value="244"></div>
    <div><label>Alto de lámina</label><input id="sheetH" type="number" step="0.01" value="165"></div>
    <div><label>Margen entre cortes</label><input id="gap" type="number" step="0.01" value="0"></div>
    <div><label>Trabajo / cliente</label><input id="job" type="text" value="Corte de vidrio"></div>
  </div>

  <div class="table-wrap">
    <table id="tbl">
      <thead><tr><th>Ubicación / ID</th><th>Ancho</th><th>Alto</th><th>Cantidad</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="toolbar">
    <button id="btnAdd" class="secondary" type="button">+ Agregar medida</button>
    <button id="btnCalc" class="primary" type="button">Calcular acomodo</button>
    <button id="btnPrint" class="secondary" type="button">Generar PDF</button>
    <button id="btnSave" class="secondary" type="button">Guardar trabajo</button>
    <button id="btnLoad" class="secondary" type="button">Cargar trabajo</button>
    <button id="btnClear" class="danger" type="button">Limpiar</button>
    <button id="btnInstall" class="primary install" type="button">Instalar app</button>
  </div>
  <div id="status" class="status ok">Listo para ingresar medidas.</div>
</section>

<section class="card results">
  <div class="summary" id="summary"></div>
  <div id="sheets"></div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
